name: Daily Job Search Alert

on:
  schedule:
    - cron: "15 5 * * *"    # 12:15 AM EST
    - cron: "15 14 * * *"   # 9:15 AM EST
    - cron: "15 18 * * *"   # 1:15 PM EST
    - cron: "15 21 * * *"   # 4:15 PM EST
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: job-search-alert
  cancel-in-progress: false

# Future-proof for Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------
      # Checkout (UPDATED VERSION)
      # ---------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # Python setup (UPDATED VERSION)
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------------------------------------------------
      # System dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      # ---------------------------------------------------------
      # Python dependencies
      # ---------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas

      # ---------------------------------------------------------
      # Run scraper with retry logic (ENTERPRISE SAFE)
      # ---------------------------------------------------------
      - name: Run job scraper with retries
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: |
          set +e

          MAX_RETRIES=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "▶ Attempt $ATTEMPT of $MAX_RETRIES"

            python job_alert_multi.py
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Job completed successfully"
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "⚠️ Failure (exit $EXIT_CODE). Retrying in 20 mins..."
              sleep 1200
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ All retries failed"

          # IMPORTANT: Do NOT block email requirement
          # Let workflow still succeed so next schedules continue
          exit 0

      # ---------------------------------------------------------
      # OPTIONAL: Keep repo active (prevents 60-day disable)
      # ---------------------------------------------------------
